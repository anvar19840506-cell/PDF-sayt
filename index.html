<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Studio</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--tg-theme-bg-color, #f0f2f5); color: var(--tg-theme-text-color, #1a1a1a); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { background: var(--tg-theme-secondary-bg-color, #fff); width: 100%; max-width: 500px; padding: 22px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin: 0 0 6px; }
        p.sub { text-align: center; opacity: 0.75; font-size: 14px; margin: 0 0 20px; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 6px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        textarea { height: 150px; resize: vertical; }
        button { width: 100%; padding: 14px; margin-top: 16px; background: #0088cc; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #status { text-align: center; margin-top: 12px; font-size: 14px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Pro PDF Studio</h1>
        <p class="sub">Matnni kiriting va PDF faylni oling</p>

        <label>Hujjat sarlavhasi:</label>
        <input type="text" id="title" placeholder="Masalan: Hisobot">

        <label>Asosiy matn:</label>
        <textarea id="content" placeholder="Matnni shu yerga yozing..."></textarea>

        <button onclick="yuborish()">📥 PDF yaratish va olish</button>
        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function yuborish() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            const status = document.getElementById("status");

            if (!content) {
                alert("Iltimos, avval matn kiriting!");
                return;
            }

            // 1. Agar Telegram ichidan ochilgan bo'lsa:
            if (tg && typeof tg.sendData === "function" && tg.initData !== "") {
                status.innerText = "⏳ PDF tayyorlanmoqda...";
                tg.sendData(JSON.stringify({ title: title, content: content }));
                return;
            }

            // 2. Oddiy brauzer yoki Menu tugmasidan ochilganda ham o'zi sof PDF yasab yuklaydi (hech qanday kutubxonasiz!):
            const matn = (title ? title + "\n\n" : "") + content;
            const tozaMatn = matn.replace(/[^\x20-\x7E\n]/g, "?").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
            const qatorlar = tozaMatn.split("\n").map((line, i) => `1 0 0 1 50 ${750 - i * 18} Tm (${line}) Tj`).join("\n");
            
            const pdfContent = `%PDF-1.4
1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
3 0 obj << /Type /Page /Parent 2 0 R /Resources << /Font << /F1 4 0 R >> >> /MediaBox [0 0 612 792] /Contents 5 0 R >> endobj
4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj
5 0 obj << /Length ${qatorlar.length + 25} >> stream
BT /F1 14 Tf
${qatorlar}
ET
endstream endobj
xref
0 6
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000229 00000 n 
0000000297 00000 n 
trailer << /Size 6 /Root 1 0 R >>
startxref
${380 + qatorlar.length}
%%EOF`;

            const blob = new Blob([pdfContent], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = (title || "hujjat") + ".pdf";
            link.click();
            status.innerText = "✅ PDF yuklab olindi!";
        }
    </script>
</body>
</html>
