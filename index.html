<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Studio</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--tg-theme-bg-color, #f0f2f5); color: var(--tg-theme-text-color, #1a1a1a); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--tg-theme-secondary-bg-color, #fff); width: 100%; max-width: 500px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; }
        p.sub { text-align: center; opacity: 0.7; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 6px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        textarea { height: 150px; resize: vertical; }
        button { width: 100%; padding: 14px; margin-top: 15px; background: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-bot { background: #28a745; margin-top: 10px; }
        .tg-link { display: block; text-align: center; margin-top: 15px; color: #0088cc; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Pro PDF Studio</h1>
        <p class="sub">Matnlarni soniyalar ichida professional PDF hujjatga aylantiring</p>

        <label>Hujjat sarlavhasi:</label>
        <input type="text" id="title" placeholder="Masalan: Hisobot yoki Rezyume">

        <label>Asosiy matn:</label>
        <textarea id="content" placeholder="Hujjat matnini shu yerga yozing..."></textarea>

        <button onclick="downloadDirectPDF()">📥 PDF faylni yuklab olish</button>
        <button id="sendBotBtn" class="btn-bot" style="display:none;" onclick="sendToBot()">🤖 PDF ni Telegram chatga yuborish</button>

        <a href="https://t.me" class="tg-link" target="_blank">🤖 Telegram botimizga o'tish</a>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initData !== "") {
                document.getElementById("sendBotBtn").style.display = "block";
            }
        }

        function downloadDirectPDF() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            if (!content) { alert("Iltimos, matn kiriting!"); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            if (title) {
                doc.setFontSize(18);
                doc.text(title, 105, y, { align: "center" });
                y += 15;
            }
            doc.setFontSize(12);
            const lines = doc.splitTextToSize(content, 180);
            doc.text(lines, 15, y);
            doc.save((title || "hujjat") + ".pdf");
        }

        function sendToBot() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            if (!content) { tg.showAlert("Iltimos, matn kiriting!"); return; }
            tg.sendData(JSON.stringify({ title: title, content: content }));
        }
    </script>
</body>
</html>
