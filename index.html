<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Studio</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 460px; padding: 28px 24px; border-radius: 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { font-size: 22px; text-align: center; color: #0f172a; margin-bottom: 6px; }
        p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; margin-bottom: 14px; background: #f8fafc; }
        textarea { height: 140px; resize: vertical; }
        button { width: 100%; padding: 15px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: 0.6; }
        #msg { text-align: center; margin-top: 12px; font-size: 14px; font-weight: 600; color: #059669; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📄 Pro PDF Studio</h1>
        <p class="sub">Matnni kiriting va PDF faylni oling</p>

        <label>Hujjat sarlavhasi</label>
        <input type="text" id="title" placeholder="Masalan: Hisobot">

        <label>Asosiy matn</label>
        <textarea id="content" placeholder="Matnni shu yerga kiriting..."></textarea>

        <button id="btn" onclick="yaratish()">📥 PDF yaratish va olish</button>
        <div id="msg"></div>
    </div>

    <script>
        // SHU YERGA @BotFather DAN OLGAN OXIRGI TOKENINGIZNI YOZING:
        const TOKEN = "SIZNING_YANGI_TOKENINGIZ";

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        async function yaratish() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            const btn = document.getElementById("btn");
            const msg = document.getElementById("msg");

            if (!content) { alert("Matn kiriting!"); return; }

            // Sof PDF fayl yaratish (tashqi kutubxonasiz)
            const matn = (title ? title + "\n\n" : "") + content;
            const toza = matn.replace(/[^\x20-\x7E\n]/g, "?").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
            const qatorlar = toza.split("\n").map((l, i) => `1 0 0 1 50 ${750 - i * 18} Tm (${l}) Tj`).join("\n");
            
            const pdf = `%PDF-1.4
1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
3 0 obj << /Type /Page /Parent 2 0 R /Resources << /Font << /F1 4 0 R >> >> /MediaBox [0 0 612 792] /Contents 5 0 R >> endobj
4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj
5 0 obj << /Length ${qatorlar.length + 25} >> stream
BT /F1 14 Tf
${qatorlar}
ET
endstream endobj
xref
0 6
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000229 00000 n 
0000000297 00000 n 
trailer << /Size 6 /Root 1 0 R >>
startxref
${380 + qatorlar.length}
%%EOF`;

            const blob = new Blob([pdf], { type: "application/pdf" });
            const fileName = (title || "hujjat") + ".pdf";

            // 1. Telegram ichida ochilgan bo'lsa to'g'ridan-to'g'ri chatga yuboradi:
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                btn.disabled = true;
                btn.innerText = "⏳ Chatga yuborilmoqda...";

                const fd = new FormData();
                fd.append("chat_id", tg.initDataUnsafe.user.id);
                fd.append("document", blob, fileName);

                const url = "https://" + "api.telegram.org/bot" + TOKEN + "/sendDocument";
                const res = await fetch(url, { method: "POST", body: fd });
                const data = await res.json();

                if (data.ok) {
                    tg.close();
                } else {
                    btn.disabled = false;
                    btn.innerText = "📥 PDF yaratish va olish";
                    msg.style.color = "red";
                    msg.innerText = "Xato: Token noto'g'ri yoki botga /start bosilmagan!";
                }
                return;
            }

            // 2. Oddiy brauzerda yuklab oladi:
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            msg.innerText = "✅ PDF yuklab olindi!";
        }
    </script>
</body>
</html>
