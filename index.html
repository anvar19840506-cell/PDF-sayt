<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Studio</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <h2>📄 Pro PDF Studio</h2>
    <input type="text" id="title" placeholder="Sarlavha..."><br><br>
    <textarea id="content" placeholder="Matnni kiriting..." rows="6" cols="35"></textarea><br><br>
    
    <button onclick="yuklabOlish()">📥 PDF Skachat qilish</button>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.ready();

        function yuklabOlish() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();

            if (!content) {
                alert("Matn kiriting!");
                return;
            }

            // 1. Telegram ichida bo'lsa botga uzatadi (bot chatga PDF tashlaydi)
            if (tg && tg.initData !== "") {
                tg.sendData(JSON.stringify({ title: title, content: content }));
                return;
            }

            // 2. Brauzerda (kompyuter/telefonda) to'g'ridan-to'g'ri SKACHAT qilish kodi:
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            if (title) doc.text(title, 20, 20);
            const qatorlar = doc.splitTextToSize(content, 170);
            doc.text(qatorlar, 20, title ? 35 : 20);

            // Faylni Blob (fayl oqimi) ga aylantirib majburiy yuklab olish:
            const pdfBlob = doc.output("blob");
            const url = URL.createObjectURL(pdfBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = (title || "hujjat") + ".pdf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
