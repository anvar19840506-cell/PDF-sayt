<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Studio</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--tg-theme-bg-color, #f0f2f5); color: var(--tg-theme-text-color, #1a1a1a); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { background: var(--tg-theme-secondary-bg-color, #ffffff); width: 100%; max-width: 500px; padding: 22px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin: 0 0 6px; }
        p.sub { text-align: center; opacity: 0.75; font-size: 14px; margin: 0 0 20px; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 6px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        textarea { height: 150px; resize: vertical; }
        button { width: 100%; padding: 14px; margin-top: 16px; background: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .tg-link { display: block; text-align: center; margin-top: 16px; color: #0088cc; text-decoration: none; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Pro PDF Studio</h1>
        <p class="sub">Telefon va kompyuterda soniyalar ichida PDF yarating</p>

        <label>Hujjat sarlavhasi:</label>
        <input type="text" id="title" placeholder="Masalan: Mustaqil ish yoki Hisobot">

        <label>Asosiy matn:</label>
        <textarea id="content" placeholder="PDF ichiga yoziladigan matnni shu yerga kiriting..."></textarea>

        <button id="mainBtn" onclick="createPDF()">📥 PDF yaratish va olish</button>

        <a href="https://t.me" class="tg-link" target="_blank">🤖 Telegram botimizga o'tish</a>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        async function createPDF() {
            const title = document.getElementById("title").value.trim();
            const content = document.getElementById("content").value.trim();
            const btn = document.getElementById("mainBtn");

            if (!content) {
                if (tg && tg.showAlert) tg.showAlert("Iltimos, avval matn kiriting!");
                else alert("Iltimos, avval matn kiriting!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            if (title) {
                doc.setFontSize(18);
                doc.text(title, 105, y, { align: "center" });
                y += 14;
            }
            doc.setFontSize(12);
            const lines = doc.splitTextToSize(content, 180);
            doc.text(lines, 15, y);

            const fileName = (title || "hujjat") + ".pdf";

            // 1. Agar Telegram ichidan ochilgan bo'lsa:
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                btn.disabled = true;
                btn.innerText = "⏳ PDF chatga yuborilmoqda...";

                try {
                    const pdfBlob = doc.output("blob");
                    const formData = new FormData();
                    formData.append("chat_id", tg.initDataUnsafe.user.id);
                    formData.append("document", pdfBlob, fileName);
                    formData.append("caption", "✅ Tayyor PDF hujjatingiz!");

                    const botToken = "9032732859:AAHe-cZ4CBAMkzjEf-PTGN3aDMNCdglrFGg";
                    const apiUrl = "https://" + "api.telegram.org/bot" + botToken + "/sendDocument";

                    const response = await fetch(apiUrl, { method: "POST", body: formData });
                    const result = await response.json();

                    if (result.ok) {
                        tg.close(); // Oynani yopadi va tayyor PDF chatda turadi!
                    } else {
                        throw new Error("Yuborishda xato");
                    }
                } catch (e) {
                    btn.disabled = false;
                    btn.innerText = "📥 PDF yaratish va olish";
                    tg.showAlert("Xatolik: Avval botga /start bosganingizga ishonch hosil qiling!");
                }
            } else {
                // 2. Oddiy brauzerdan (Chrome/Safari) ochilgan bo'lsa to'g'ridan-to'g'ri yuklaydi:
                doc.save(fileName);
            }
        }
    </script>
</body>
</html>
